<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Tests — CapyFront</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    body {
      font-family: system-ui, sans-serif;
      background: #f8fafc;
      margin: 0;
      min-height: 100vh;
      color: #1a202c;
    }

    header {
      background: #2d7d46;
      color: #fff;
      padding: 16px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    header h1 { margin: 0; font-size: 1.25rem; font-weight: 700; }
    header a {
      color: rgba(255,255,255,.9);
      text-decoration: none;
      font-size: .875rem;
    }
    header a:hover { color: #fff; text-decoration: underline; }

    .summary { padding: 24px 32px 8px; }
    .banner {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 20px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 1rem;
    }
    .banner.running { background: #fef9c3; color: #854d0e; }
    .banner.pass    { background: #dcfce7; color: #166534; }
    .banner.fail    { background: #fee2e2; color: #991b1b; }

    .results {
      padding: 16px 32px 56px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .group-label {
      font-size: .7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: #94a3b8;
      padding: 8px 4px 2px;
    }

    .card {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      overflow: hidden;
    }
    .card-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 18px;
    }
    .status { font-size: 1.05rem; width: 22px; text-align: center; flex-shrink: 0; }
    .spinner { display: inline-block; animation: spin .7s linear infinite; }
    .card-name { font-weight: 600; font-size: .9rem; color: #1a202c; flex: 1; }
    .card-log {
      border-top: 1px solid #f1f5f9;
      padding: 10px 18px 12px;
      font-family: monospace;
      font-size: .8rem;
      line-height: 1.6;
      color: #64748b;
      white-space: pre-wrap;
    }
    .card-log.empty { display: none; }
    .log-error { color: #dc2626; }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<header>
  <h1>🧪 Tests — CapyFront</h1>
  <a href="../index.html">← Volver al inicio</a>
</header>

<div class="summary">
  <div id="banner" class="banner running">
    <span class="spinner">⏳</span> Ejecutando tests…
  </div>
</div>

<div class="results" id="results"></div>

<!-- cada test generado por capy-new se agrega en TESTS abajo -->
<script type="module">
const TESTS = [
  { name: 'loading-spinner', group: 'Componentes', path: '../components/loading-spinner/loading-spinner.test.js' },
  { name: 'header-bar',      group: 'Componentes', path: '../components/header-bar/header-bar.test.js' },
  { name: 'footer-bar',      group: 'Componentes', path: '../components/footer-bar/footer-bar.test.js' },
// capy-new:end
];

const container = document.getElementById('results');
const banner    = document.getElementById('banner');

// Render cards grouped
let lastGroup = null;
for (let i = 0; i < TESTS.length; i++) {
  const t = TESTS[i];
  if (t.group !== lastGroup) {
    const label = document.createElement('div');
    label.className = 'group-label';
    label.textContent = t.group;
    container.appendChild(label);
    lastGroup = t.group;
  }
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <div class="card-header">
      <span class="status" id="s${i}"><span class="spinner">⏳</span></span>
      <span class="card-name">${t.name}</span>
    </div>
    <div class="card-log empty" id="l${i}"></div>
  `;
  container.appendChild(card);
}

let passed = 0;

for (let i = 0; i < TESTS.length; i++) {
  const t = TESTS[i];
  const logs = [];
  const origLog = console.log;
  console.log = (...args) => { logs.push(args.map(String).join(' ')); origLog(...args); };

  let ok = true, errMsg = '';
  try {
    await import(t.path);
  } catch (e) {
    ok = false;
    errMsg = e.message;
  }
  console.log = origLog;
  if (ok) passed++;

  document.getElementById(`s${i}`).textContent = ok ? '✅' : '❌';

  const logEl = document.getElementById(`l${i}`);
  const lines = [...logs];
  if (!ok && errMsg) lines.push(`\x00${errMsg}`);

  if (lines.length) {
    logEl.classList.remove('empty');
    logEl.innerHTML = lines.map(l =>
      l.startsWith('\x00')
        ? `<span class="log-error">${l.slice(1)}</span>`
        : `<span>${l}</span>`
    ).join('\n');
  }
}

banner.className = `banner ${passed === TESTS.length ? 'pass' : 'fail'}`;
banner.innerHTML = `${passed === TESTS.length ? '✅' : '❌'} <span>${passed} / ${TESTS.length} tests pasaron</span>`;
</script>

</body>
</html>
