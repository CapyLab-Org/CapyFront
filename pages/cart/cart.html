<header-bar-component></header-bar-component>

<nav class="topnav">
  <a href="#home">← Seguir comprando</a>
</nav>

<section class="cart-section">
  <h1>Tu carrito 🛒</h1>

  <ul class="item-list">
    {{#each items}}
      <li class="item">
        <span class="item-emoji">{{emoji}}</span>
        <span class="item-name">{{name}}</span>
        <span class="item-price">${{price}}</span>
        <button class="btn-remove" data-id="{{id}}">✕</button>
      </li>
    {{/each}}
  </ul>

  <p class="empty-msg">{{emptyMsg}}</p>
  <p class="total">Total: <strong>${{total}}</strong></p>
  <button class="btn-clear">Vaciar carrito</button>
</section>

<footer-bar-component></footer-bar-component>
