<header-bar-component></header-bar-component>

<section class="contact">
  <h1>Contacto</h1>
  <p class="lead">¿Tenés preguntas o feedback? Mandá un mensaje.</p>
  <form id="contact-form">
    <label for="contact-name">Nombre</label>
    <input type="text" id="contact-name" name="name" placeholder="Tu nombre" required />
    <label for="contact-message">Mensaje</label>
    <textarea id="contact-message" name="message" rows="5" placeholder="Tu mensaje..." required></textarea>
    <button type="submit">Enviar mensaje</button>
  </form>
</section>

<footer-bar-component></footer-bar-component>
