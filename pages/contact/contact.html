<section class="contact-section">
  <h1>Contacto</h1>
  <p class="subtitle">Demo de formulario + modelo <code>saveContact</code> (POST)</p>

  <form id="contact-form">
    <label>Nombre
      <input type="text" id="contact-name" placeholder="Tu nombre" />
    </label>
    <label>Email
      <input type="email" id="contact-email" placeholder="tu@email.com" />
    </label>
    <label>Mensaje
      <textarea id="contact-message" rows="4" placeholder="Escribí tu mensaje..."></textarea>
    </label>
    <p class="error-msg">{{error}}</p>
    <button type="submit">Enviar mensaje</button>
  </form>

  <div class="success-msg">{{successMsg}}</div>
</section>
