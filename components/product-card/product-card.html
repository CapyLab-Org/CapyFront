<div class="card">
  <div class="emoji">{{emoji}}</div>
  <h3>{{name}}</h3>
  <p class="price">${{price}}</p>
  <p class="stock">Stock: {{stock}}</p>
  <div class="actions">
    <a class="btn-detail" href="#product/{{id}}">Ver detalle</a>
    <button class="btn-add">+ Agregar</button>
  </div>
</div>
